name: Release

# 打 v* tag 才发。Go 库的「发布」就是这个 tag —— 有了它
# `go get github.com/fusedmodel/ncc-registry@v1.2.3` 才能解析；
# 二进制与镜像只是同一个 tag 的附带产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 刻意写死而不是用 github.repository：部署侧的引用要与之逐字一致，
  # 用变量会在 fork / 改名的仓库里静默错位。
  IMAGE: ghcr.io/fusedmodel/ncc-registry

jobs:
  # ---------------------------------------------------------------- 二进制
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译（CGO 关掉：SQLite 驱动是纯 Go，产物可直接跑在 alpine / scratch）
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          [[ "${GOOS}" == "windows" ]] && ext=".exe"
          out="ncc-registry-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags="-s -w" -o "dist/${out}" ./cmd/ncc-registry
          ls -la "dist/${out}"

      - uses: actions/upload-artifact@v4
        with:
          name: ncc-registry-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验和
        working-directory: dist
        run: |
          ls -la
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: 建 / 更新 Release（幂等：重跑同一个 tag 不会炸）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --generate-notes
          fi
          gh release view "${TAG}" --json assets --jq '.assets[].name'

  # ---------------------------------------------------------------- 容器镜像
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
